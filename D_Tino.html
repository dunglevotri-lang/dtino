<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-tino AOV</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:black;
    color:white;
}

/* Tiêu đề web ở giữa */
h1{
    text-align:center;
    margin-top:30px;
    font-size:40px;
    letter-spacing:2px;
}

/* Banner chính */
.main-btn{
    width:90%;
    max-width:800px;
    margin:20px auto;
    padding:20px;
    background:#111;
    border:2px solid #333;
    border-radius:15px;
    font-size:22px;
    cursor:pointer;
    transition:0.3s;
    text-align:left;
}

.main-btn:hover{
    background:#1a1a1a;
    transform:scale(1.02);
}

/* POPUP */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    visibility:hidden;
    transition:0.4s ease;
}

.popup.active{
    opacity:1;
    visibility:visible;
}

.popup-content{
    background:#111;
    width:90%;
    max-width:900px;
    min-height:70vh;
    padding:30px;
    border-radius:20px;
    transform:scale(0.85);
    transition:0.4s ease;
    text-align:left;
}

.popup.active .popup-content{
    transform:scale(1);
}

/* Banner con */
.sub-banner{
    margin:15px 0;
    padding:15px;
    background:#1c1c1c;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
    text-align:center;
}

.sub-banner:hover{
    background:#2a2a2a;
    transform:scale(1.02);
}

/* Icon bên trái */
.mod-item{
    display:flex;
    align-items:center;
    gap:15px;
}

.mod-item img{
    width:60px;
    height:60px;
}

/* Ảnh QR */
.qr-img{
    width:220px;
    margin-top:20px;
}
</style>
</head>

<body>

<h1>D-tino AOV</h1>

<div class="main-btn" onclick="openPopup('donatePopup')">
    DONATE
</div>

<div class="main-btn" onclick="openPopup('modPopup')">
    CHỌN MOD
</div>

<div class="main-btn" onclick="openPopup('mapPopup')">
    MOD MAP LIÊN QUÂN
</div>

<!-- DONATE -->
<div class="popup" id="donatePopup" onclick="closePopup(event,this)">
    <div class="popup-content">
        <h5>DONATE</h5>
        <img src="qr.png" class="qr-img">
    </div>
</div>

<!-- CHỌN MOD -->
<div class="popup" id="modPopup" onclick="closePopup(event,this)">
    <div class="popup-content">
        <h5>CHỌN MOD</h5>

        <div class="sub-banner" onclick="goLink(event,'https://link4m.com/8Kj9ed')">
            <div class="mod-item">
                <img src="Florentino_3_in_1.png">
                <div>Florentino 3 in 1</div>
            </div>
        </div>

    </div>
</div>

<!-- MOD MAP LIÊN QUÂN -->
<div class="popup" id="mapPopup" onclick="closePopup(event,this)">
    <div class="popup-content">

        <h5>MOD MAP LIÊN QUÂN</h5>

        <div class="sub-banner" onclick="goLink(event,'https://link4m.com/6Pk9le')">Map minecraft</div>
        <div class="sub-banner" onclick="goLink(event,'https://link4m.com/rbWfsf9')">Map nether_minecraft</div>
        <div class="sub-banner" onclick="goLink(event,'https://link4m.com/OnkEz')">Map minecraft 2.0</div>
        <div class="sub-banner" onclick="goLink(event,'https://link4m.com/Obqtv')">Map roblox beta</div>
        <div class="sub-banner" onclick="goLink(event,'https://link4m.com/345q1')">Map hoa anh đào</div>
        <div class="sub-banner" onclick="goLink(event,'https://link4m.com/gmzdBaN')">Map ma pháp</div>
        <div class="sub-banner" onclick="goLink(event,'https://link4m.com/HgQnzvhF')">Map hắc hóa</div>
        <div class="sub-banner" onclick="goLink(event,'https://link4m.com/StYJKQOD')">Map jujutsu kaisen beta</div>
        <div class="sub-banner" onclick="goLink(event,'https://link4m.com/MxlHP')">Map naruto beta</div>
        <div class="sub-banner" onclick="goLink(event,'https://link4m.com/gmzdBaN')">Map ma pháp</div>

    </div>
</div>

<script>
function openPopup(id){
    document.getElementById(id).classList.add("active");
}

function closePopup(event, popup){
    if(event.target === popup){
        popup.classList.remove("active");
    }
}

function goLink(event, link){
    event.stopPropagation();
    window.open(link, "_blank");
}
</script>

</body>
</html>
